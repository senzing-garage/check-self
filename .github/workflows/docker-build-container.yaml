---
name: Docker build container

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-amd64:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository name
        id: repo-basename
        run: |
          echo "repo=$(basename ${{ github.repository }})" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Build docker image
        uses: senzing-factory/github-action-docker-buildx-build@v2
        with:
          image-repository: senzing/${{ steps.repo-basename.outputs.repo }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }} # zizmor: ignore[secrets-outside-env]
          platforms: "linux/amd64"
          username: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env]

  build-arm64:
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Get repository name
        id: repo-basename
        run: |
          echo "repo=$(basename ${{ github.repository }})" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Free disk space
        run: |
          rm -rf /opt/hostedtoolcache
        shell: bash

      - name: Build docker image
        uses: senzing-factory/github-action-docker-buildx-build@v2
        with:
          image-repository: senzing/${{ steps.repo-basename.outputs.repo }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }} # zizmor: ignore[secrets-outside-env]
          platforms: "linux/arm64"
          username: ${{ secrets.DOCKERHUB_USERNAME }} # zizmor: ignore[secrets-outside-env]

  docker-build-container:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: always()

    steps:
      - name: Verify per-platform builds succeeded
        env:
          AMD64_RESULT: ${{ needs.build-amd64.result }}
          ARM64_RESULT: ${{ needs.build-arm64.result }}
        run: |
          if [[ "$AMD64_RESULT" != "success" || "$ARM64_RESULT" != "success" ]]; then
            echo "build-amd64: $AMD64_RESULT"
            echo "build-arm64: $ARM64_RESULT"
            exit 1
          fi
          echo "All per-platform builds succeeded."
        shell: bash
